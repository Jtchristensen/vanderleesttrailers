name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Write stub environment config
        run: |
          mkdir -p frontend/src/environments
          cat > frontend/src/environments/environment.ts <<'EOF'
          export const environment = {
            apiUrl: '/api',
            userPoolId: 'stub',
            userPoolClientId: 'stub',
            region: 'us-east-1',
          };
          EOF

      - name: Run unit tests
        working-directory: frontend
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Install CDK dependencies for Lambda tests
        working-directory: cdk
        run: npm install

      - name: Run Lambda unit tests
        working-directory: cdk
        run: node --test lambda/chat/__tests__/*.test.mjs

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Write stub environment config
        run: |
          mkdir -p frontend/src/environments
          cat > frontend/src/environments/environment.ts <<'EOF'
          export const environment = {
            apiUrl: '/api',
            userPoolId: 'stub',
            userPoolClientId: 'stub',
            region: 'us-east-1',
          };
          EOF

      - name: Build frontend
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Install CDK dependencies
        working-directory: cdk
        run: npm install

      - name: CDK Synth (validate stack)
        working-directory: cdk
        run: npx cdk synth --quiet
