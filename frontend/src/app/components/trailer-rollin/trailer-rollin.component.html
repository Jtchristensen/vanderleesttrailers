<!-- Sits inside .hero, after .hero__grain, before .hero__content -->
<div class="rollin" aria-hidden="true">
  <svg viewBox="0 0 1000 380" preserveAspectRatio="xMidYMax meet" style="width: 100%; height: 100%; color: var(--color-accent);">
    <defs>
      <linearGradient id="vlBody" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(46,163,242,0.30)"></stop>
        <stop offset="100%" stop-color="rgba(46,163,242,0.06)"></stop>
      </linearGradient>
      <radialGradient id="vlShadow">
        <stop offset="0%" stop-color="rgba(0,0,0,0.7)"></stop>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"></stop>
      </radialGradient>
      <radialGradient id="vlBackup">
        <stop offset="0%" stop-color="rgba(255,255,255,0.8)"></stop>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
      </radialGradient>
    </defs>

    <line x1="-400" y1="300" x2="1400" y2="300" stroke="currentColor" stroke-width="1.5" style="opacity: 0.35;"></line>
    <g stroke="currentColor" stroke-width="1.2" style="opacity: 0.18;">
      <path d="M-320 312 h30 M-190 318 h24 M-80 310 h28 M60 312 h34 M140 318 h22 M240 310 h30 M330 320 h18 M430 312 h26 M540 318 h30 M650 310 h20 M760 320 h34 M880 312 h24 M1010 318 h30 M1140 310 h26"></path>
    </g>

    <ellipse cx="680" cy="302" rx="290" ry="14" fill="url(#vlShadow)" style="opacity: 0.8;"></ellipse>

    <!-- Backing guideline: spans ball to coupler, closing as the truck arrives.
         Drawn full length and scaled about the coupler end, so it always ends
         exactly on the ball. Peaks mid-approach so it isn't sitting there
         alone at the top of the page. -->
    <g style="transform-box: view-box; transform-origin: 362px 272px; transform: scaleX(calc(1 - var(--roll, 0))); opacity: calc(var(--roll, 0) * (1 - var(--roll, 0)) * 1.8);">
      <path d="M-788 272 H362" stroke="var(--color-accent)" stroke-width="2" stroke-dasharray="16 14" vector-effect="non-scaling-stroke"></path>
    </g>

    <!-- Tow vehicle backing in from the left. Sized so the tires meet the
         trailer's contact line and the ball lands under the coupler. -->
    <g style="transform: translate(calc((1 - var(--roll, 0)) * -1150px), 0);">
      <ellipse cx="108" cy="311" rx="240" ry="12" fill="url(#vlShadow)" style="opacity: 0.75;"></ellipse>
      <image href="/assets/truck-side.png" x="-133" y="141" width="483" height="172"></image>

      <!-- reverse lamps: light spilling behind the truck while it's backing -->
      <ellipse cx="376" cy="238" rx="60" ry="30" fill="url(#vlBackup)" style="opacity: calc((1 - var(--roll, 0)) * 0.45);"></ellipse>

      <!-- receiver + ball the coupler seats onto -->
      <path d="M312 279 H362" stroke="var(--color-accent)" stroke-width="6" stroke-linecap="round"></path>
      <path d="M362 279 V276" stroke="var(--color-accent)" stroke-width="5" stroke-linecap="round"></path>
      <circle cx="362" cy="272" r="8" fill="var(--color-accent)"></circle>
    </g>

    <!-- Tongue jack: planted on the ground, the trailer lowers down it -->
    <path d="M432 248 V300 M420 300 H444 M424 244 h16" stroke="var(--color-accent)" stroke-width="2" style="opacity: 0.5;"></path>

    <!-- Parked trailer: nose held up on the jack, then seated on the ball -->
    <g style="transform-box: view-box; transform-origin: 758px 282px; transform: rotate(calc((1 - var(--drop, 0)) * 5deg));">
      <path d="M940 264 V116 H552 L488 168 V264 Z" fill="url(#vlBody)" stroke="var(--color-accent)" stroke-width="2"></path>
      <path d="M552 108 H940" stroke="var(--color-accent)" stroke-width="4" stroke-linecap="round" style="opacity: 0.8;"></path>
      <path d="M600 116 V264 M656 116 V264 M712 116 V264 M768 116 V264 M824 116 V264 M880 116 V264" stroke="var(--color-accent)" stroke-width="1" style="opacity: 0.22;"></path>
      <path d="M918 254 V128" stroke="var(--color-accent)" stroke-width="1.5" style="opacity: 0.45;"></path>
      <path d="M488 244 L372 274 L372 286 L488 268 Z" fill="url(#vlBody)" stroke="var(--color-accent)" stroke-width="2"></path>
      <path d="M372 270 H350 V292 H372 Z" fill="#0a0d10" stroke="var(--color-accent)" stroke-width="2"></path>

      <circle cx="712" cy="282" r="34" fill="#0a0d10" stroke="var(--color-accent)" stroke-width="2.5"></circle>
      <circle cx="712" cy="282" r="13" fill="none" stroke="var(--color-accent)" stroke-width="2" style="opacity: 0.8;"></circle>
      <path d="M712 251 V269 M712 295 V313 M681 282 H699 M725 282 H743" stroke="var(--color-accent)" stroke-width="2" style="opacity: 0.5;"></path>
      <circle cx="804" cy="282" r="34" fill="#0a0d10" stroke="var(--color-accent)" stroke-width="2.5"></circle>
      <circle cx="804" cy="282" r="13" fill="none" stroke="var(--color-accent)" stroke-width="2" style="opacity: 0.8;"></circle>
      <path d="M804 251 V269 M804 295 V313 M773 282 H791 M817 282 H835" stroke="var(--color-accent)" stroke-width="2" style="opacity: 0.5;"></path>
      <path d="M670 264 q42 -46 84 0 M762 264 q42 -46 84 0" fill="none" stroke="var(--color-accent)" stroke-width="2" style="opacity: 0.6;"></path>
    </g>
  </svg>
</div>

<div class="rollin__badge">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
    <path d="M20 6L9 17l-5-5" />
  </svg>
  Hitched · Ready To Haul
</div>
