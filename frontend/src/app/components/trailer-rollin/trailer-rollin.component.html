<!-- Sits inside .hero, after .hero__grain, before .hero__content -->
<div class="rollin" aria-hidden="true">
  <svg viewBox="0 0 1000 380" preserveAspectRatio="xMidYMax meet" style="width: 100%; height: 100%; color: var(--color-accent);">
    <defs>
      <radialGradient id="vlShadow">
        <stop offset="0%" stop-color="rgba(0,0,0,0.7)"></stop>
        <stop offset="100%" stop-color="rgba(0,0,0,0)"></stop>
      </radialGradient>
      <radialGradient id="vlBackup">
        <stop offset="0%" stop-color="rgba(255,255,255,0.8)"></stop>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
      </radialGradient>
    </defs>

    <!-- Horizon. Runs far wider than the viewBox because the SVG is letterboxed:
         at the rig's size a wide monitor shows several thousand user units
         either side of the 1000-unit box, and a short line would just stop. -->
    <line x1="-5000" y1="300" x2="6000" y2="300" stroke="currentColor" stroke-width="1.5" style="opacity: 0.35;"></line>
    <g stroke="currentColor" stroke-width="1.2" style="opacity: 0.18;">
      <path d="M-3200 312 h28 M-3080 318 h22 M-2950 310 h30 M-2820 320 h18 M-2700 312 h26 M-2560 318 h32 M-2440 310 h20 M-2300 320 h34 M-2180 312 h24 M-2050 318 h28 M-1920 310 h30 M-1800 320 h18 M-1670 312 h26 M-1540 318 h22 M-1410 310 h34 M-1280 320 h20 M-1150 312 h30 M-1020 318 h24 M-900 310 h28 M-780 320 h32 M-650 312 h18 M-520 318 h26 M-400 310 h22 M-320 312 h30 M-190 318 h24 M-80 310 h28 M60 312 h34 M140 318 h22 M240 310 h30 M330 320 h18 M430 312 h26 M540 318 h30 M650 310 h20 M760 320 h34 M880 312 h24 M1010 318 h30 M1140 310 h26 M1270 320 h22 M1400 312 h28 M1530 318 h32 M1650 310 h18 M1780 320 h26 M1900 312 h30 M2030 318 h20 M2160 310 h34 M2290 320 h24 M2410 312 h28 M2540 318 h22 M2670 310 h30 M2800 320 h18 M2920 312 h26 M3050 318 h32 M3180 310 h20 M3310 320 h28 M3440 312 h24 M3560 318 h30 M3690 310 h22 M3820 320 h34 M3950 312 h18 M4080 318 h26"></path>
    </g>

    <!-- Backing guideline: spans ball to coupler, closing as the truck arrives.
         Drawn 1000 units long and scaled about the coupler end by the truck's
         actual travel, so it always ends exactly on the ball and always starts
         where the truck did. Peaks mid-approach so it isn't sitting there
         alone at the top of the page. -->
    <g style="transform-box: view-box; transform-origin: 362px 272px; transform: scaleX(calc((1 - var(--roll, 0)) * var(--rigTravel, 1500) / 1000)); opacity: calc(var(--roll, 0) * (1 - var(--roll, 0)) * 1.8);">
      <path d="M-638 272 H362" stroke="var(--color-accent)" stroke-width="2" stroke-dasharray="16 14" vector-effect="non-scaling-stroke"></path>
    </g>

    <!-- The coupled rig. Once hitched, this whole group hauls out to the left —
         the truck reversed rightward to meet the trailer, so forward is left. -->
    <g class="rollin__rig">
      <ellipse cx="560" cy="304" rx="205" ry="13" fill="url(#vlShadow)" style="opacity: 0.8;"></ellipse>

      <!-- Draft off the tail of the trailer as it pulls out; peaks mid-haul. -->
      <g stroke="currentColor" stroke-linecap="round" style="opacity: calc(var(--away, 0) * (1 - var(--away, 0)) * 3.2);">
        <path d="M800 232 h70" stroke-width="3"></path>
        <path d="M830 258 h108" stroke-width="2.5"></path>
        <path d="M812 284 h64" stroke-width="2"></path>
      </g>

      <!-- Tow vehicle backing in from the left. Sized so the tires meet the
           trailer's contact line and the ball lands under the coupler. -->
      <g style="transform: translate(calc((1 - var(--roll, 0)) * var(--rigTravel, 1500) * -1px), 0);">
        <ellipse cx="108" cy="311" rx="240" ry="12" fill="url(#vlShadow)" style="opacity: 0.75;"></ellipse>
        <image href="/assets/truck-side.png" x="-133" y="141" width="483" height="172"></image>

        <!-- reverse lamps: light spilling behind the truck while it's backing -->
        <ellipse cx="376" cy="238" rx="60" ry="30" fill="url(#vlBackup)" style="opacity: calc((1 - var(--roll, 0)) * 0.45);"></ellipse>

        <!-- receiver + ball the coupler seats onto -->
        <path d="M312 279 H362" stroke="var(--color-accent)" stroke-width="6" stroke-linecap="round"></path>
        <path d="M362 279 V276" stroke="var(--color-accent)" stroke-width="5" stroke-linecap="round"></path>
        <circle cx="362" cy="272" r="8" fill="var(--color-accent)"></circle>
      </g>

      <!-- Parked trailer: nose up on its own jack, then seated on the ball.
           Photo scale (417x145 for a 777x270 source) is what makes the coupler
           land on the ball at y=272 with the tires on the same contact line as
           the truck's — the source's own coupler/tire geometry fixes it.
           The nose-up tilt pivots on the tandem's contact patch, not its axle, so
           real tires don't sink through the ground line; 3.5deg still lifts the
           coupler ~18 units clear of the ball. -->
      <g style="transform-box: view-box; transform-origin: 651px 316px; transform: rotate(calc((1 - var(--drop, 0)) * 3.5deg));">
        <image class="rollin__trailer" href="/assets/hero-trailer.png" x="350" y="173" width="417" height="145"></image>
      </g>
    </g>
  </svg>
</div>

<div class="rollin__badge">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
    <path d="M20 6L9 17l-5-5" />
  </svg>
  Hitched · Ready To Haul
</div>
